<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#08090d"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Monitor frame -->
  <rect x="5" y="6" width="22" height="15" rx="2" fill="none" stroke="url(#grad)" stroke-width="1.75"/>
  <line x1="12" y1="25" x2="20" y2="25" stroke="#00f0ff" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="16" y2="25" stroke="#00f0ff" stroke-width="1.75"/>
  <!-- Center pulse / crosshair dot -->
  <circle cx="16" cy="13.5" r="2" fill="#00f0ff"/>
</svg>
